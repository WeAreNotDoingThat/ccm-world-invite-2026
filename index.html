<style>
html,body,#map{height:100%;margin:0}
body{font-family:Arial,Helvetica,sans-serif}
#map{width:100%}
.title{position:absolute;z-index:1000;top:12px;left:50%;transform:translateX(-50%);
background:rgba(255,255,255,.94);padding:10px 14px;border-radius:10px;
box-shadow:0 1px 6px rgba(0,0,0,.28);width:min(760px,calc(100% - 32px));text-align:center;pointer-events:none}
.title h1{font-size:18px;margin:0}
.title p{font-size:12px;margin:4px 0 0;color:#444}
.rink,.hotel{display:flex;align-items:center;justify-content:center;color:white;font-weight:700;
border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.45);box-sizing:border-box}
.rink{width:28px;height:28px;border-radius:50%;background:#1f5aa6;font-size:11px}
.hotel{width:32px;height:32px;border-radius:5px;background:#7a2e8e;font-size:12px}
.legend{background:rgba(255,255,255,.95);padding:9px 11px;border-radius:8px;
box-shadow:0 1px 5px rgba(0,0,0,.25);font-size:12px;line-height:1.5}
.legend div{display:flex;align-items:center;gap:7px}
.swatch{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;color:white;font-weight:700}
.swatch.r{background:#1f5aa6;border-radius:50%}
.swatch.h{background:#7a2e8e;border-radius:3px}
.leaflet-popup-content{min-width:210px;line-height:1.4}
.leaflet-popup-content strong{display:block;margin-bottom:4px;font-size:14px}
.type{margin-top:7px;font-size:11px;font-weight:700;text-transform:uppercase;color:#666}
@media(max-width:640px){.title{top:8px}.title h1{font-size:15px}.title p{font-size:11px}}
</style>
</head>

const map=L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
}).addTo(map);

const rinks=L.layerGroup().addTo(map);
const hotel=L.layerGroup().addTo(map);
const bounds=[];

function rinkIcon(id){
  return L.divIcon({className:'',html:`<div class="rink">${id}</div>`,
    iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-15]});
}
function hotelIcon(){
  return L.divIcon({className:'',html:'<div class="hotel">H</div>',
    iconSize:[32,32],iconAnchor:[16,16],popupAnchor:[0,-17]});
}

for(const f of locations.features){
  const [lon,lat]=f.geometry.coordinates;
  const p=f.properties;
  const isHotel=p.location_type==='hotel';
  const m=L.marker([lat,lon],{
    icon:isHotel?hotelIcon():rinkIcon(p.facility_id),
    title:p.facility_name,
    riseOnHover:true
  }).bindPopup(`
    <strong>${p.facility_name}</strong>
    <div>${p.full_address}</div>
    <div class="type">${isHotel?'Hotel reference point':'Tournament facility'}</div>
  `);
  m.addTo(isHotel?hotel:rinks);
  bounds.push([lat,lon]);
}

map.fitBounds(bounds,{paddingTopLeft:[30,100],paddingBottomRight:[30,30]});
L.control.layers(null,{'Tournament facilities':rinks,'Embassy Suites Deerfield':hotel},{collapsed:false}).addTo(map);
L.control.scale({imperial:true,metric:false}).addTo(map);

const legend=L.control({position:'bottomleft'});
legend.onAdd=function(){
  const d=L.DomUtil.create('div','legend');
  d.innerHTML='<div><span class="swatch r">#</span>CCM facility</div><div><span class="swatch h">H</span>Embassy Suites Deerfield</div>';
  return d;
};
legend.addTo(map);
